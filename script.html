<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>発表原稿</title>
<style>
  :root { --ink: #1d2433; --sub: #5b6475; --line: #dde1ea; --accent: #2b5fd9; --warm: #c2410c; --bg: #f5f6f9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Yu Gothic UI", "Yu Gothic", "Hiragino Sans", "Meiryo", system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 40px 16px 80px; }
  header h1 { font-size: 28px; margin: 0 0 6px; }
  header p { color: var(--sub); margin: 0 0 6px; line-height: 1.7; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; color: var(--sub); margin: 14px 0 28px; }
  .legend b { color: var(--warm); }
  section { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; margin-bottom: 14px; break-inside: avoid; }
  .head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .no { font-weight: 800; color: var(--accent); font-size: 18px; min-width: 2em; }
  .title { font-weight: 700; font-size: 18px; flex: 1; }
  .time { font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .say { font-size: 16.5px; line-height: 1.9; margin: 0 0 8px; }
  .cue { display: inline-block; font-size: 12px; font-weight: 700; color: #fff; background: var(--warm); border-radius: 4px; padding: 1px 7px; margin-right: 8px; vertical-align: 2px; }
  .total { color: var(--sub); font-size: 14px; margin-top: 20px; }
  a { color: var(--accent); }
  .say { padding: 4px 10px; border-left: 4px solid transparent; border-radius: 4px; cursor: pointer; }
  .say.cur { background: #fff4d6; border-left-color: var(--warm); }
  section.curpage { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  #sync { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; background: #1d2433; color: #fff; padding: 8px 14px; font-size: 14px; }
  #sync button { font: inherit; color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.4); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  #sync .st { flex: 1; }
  #sync .off { color: #ffcf8a; }
  @media print {
    #sync { display: none; }
    .say.cur { background: none; border-left-color: transparent; }
    body { background: #fff; }
    main { padding: 0; }
    section { border: none; border-bottom: 1px solid var(--line); border-radius: 0; padding: 12px 0; }
    .noprint { display: none; }
  }
</style>
</head>
<body>
<div id="sync"><span class="st" id="syncSt"><span class="off">資料と連動していません。同じブラウザで資料を開くと連動します。</span></span><button id="bPrev">← 前へ</button><button id="bNext">次へ →</button></div>
<main>
  <header>
    <h1>発表原稿：AIによる3DモデリングとAI駆動開発</h1>
    <p><a href="index.html" target="_blank" rel="noopener">資料</a>を同じブラウザの別のウィンドウで開くと、資料のページ送りに合わせて、いま話す段落に色が付き、自動でスクロールします。この原稿のページで <b>→ / ← キー</b>を押すか、段落をクリックしても、資料を動かせます。</p>
    <div class="legend"><span><b>▶ 押す</b>：→ キーを押して次の項目を出す</span><span>（動画）：動画は自動で流れる。止めて話してもよい</span></div>
    <p class="noprint"><button onclick="window.print()">印刷する</button></p>
  </header>
  <div id="list"></div>
  <p class="total">※ 時間は、1秒あたり約6文字で話した場合の目安です。</p>
</main>
<script src="script-data.js"></script>
<script>
  var list = document.getElementById('list');
  var S = window.TALK_SCRIPT || [];
  S.forEach(function (s, i) {
    var sec = document.createElement('section');
    sec.id = 'sec-' + i;
    var h = '<div class="head"><span class="no">' + (i + 1) + '</span><span class="title">' + s.title + '</span><span class="time">' + s.time + '</span></div>';
    s.steps.forEach(function (t, k) {
      h += '<p class="say" id="p-' + i + '-' + k + '" data-i="' + i + '" data-k="' + k + '">' + (k > 0 ? '<span class="cue">▶ 押す</span>' : '') + t + '</p>';
    });
    sec.innerHTML = h;
    list.appendChild(sec);
  });

  // 資料（index.html）のページ送りと連動する
  var ch = null, last = null, target = null;
  try { if ('BroadcastChannel' in window) ch = new BroadcastChannel('deck-sync'); } catch (e) {}
  function send(m) {
    m.id = Date.now() + '-' + Math.random();   // 2つの経路で届いても、資料側で1回だけ実行する
    try { if (ch) ch.postMessage(m); } catch (e) {}
    try { localStorage.setItem('deck-sync-cmd', JSON.stringify(m)); } catch (e) {}
  }
  function apply(st) {
    if (!st || st.t !== 'state') return;
    if (last && st.seq && last.seq && st.seq <= last.seq) return;   // 2つの経路で届く同じ状態・古い状態は無視する
    last = st;
    var old = document.querySelectorAll('.say.cur, section.curpage');
    for (var j = 0; j < old.length; j++) old[j].classList.remove('cur', 'curpage');
    var sec = document.getElementById('sec-' + st.cur);
    var steps = S[st.cur] ? S[st.cur].steps.length : 1;
    var p = document.getElementById('p-' + st.cur + '-' + Math.min(st.step, steps - 1));
    if (sec) sec.classList.add('curpage');
    if (p) { p.classList.add('cur'); p.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    document.getElementById('syncSt').textContent = '資料と連動中：' + (st.cur + 1) + ' / ' + st.n + ' ページ';
    // 段落をクリックしたときは、その段落まで資料を進める
    if (target && target.cur === st.cur) {
      if (st.step < target.step) send({ t: 'next' }); else target = null;
    }
  }
  if (ch) ch.onmessage = function (e) { apply(e.data); };
  window.addEventListener('storage', function (e) {
    if (e.key === 'deck-sync-state' && e.newValue) { try { apply(JSON.parse(e.newValue)); } catch (x) {} }
  });
  document.getElementById('bNext').onclick = function () { target = null; send({ t: 'next' }); };
  document.getElementById('bPrev').onclick = function () { target = null; send({ t: 'prev' }); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); target = null; send({ t: 'next' }); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); target = null; send({ t: 'prev' }); }
  });
  list.addEventListener('click', function (e) {
    var p = e.target.closest ? e.target.closest('.say') : null;
    if (!p) return;
    target = { cur: +p.dataset.i, step: +p.dataset.k };
    send({ t: 'goto', cur: target.cur });
  });
  try { var saved = localStorage.getItem('deck-sync-state'); if (saved) apply(JSON.parse(saved)); } catch (e) {}
  send({ t: 'hello' });
</script>
</body>
</html>
